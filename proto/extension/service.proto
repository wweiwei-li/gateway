syntax = "proto3";

package envoygateway.extension;

import "envoy/config/cluster/v3/cluster.proto";
import "envoy/config/endpoint/v3/endpoint.proto";
import "envoy/config/listener/v3/listener.proto";
import "envoy/config/route/v3/route_components.proto";
import "envoy/config/route/v3/route.proto";
import "envoy/extensions/transport_sockets/tls/v3/secret.proto";

import "proto/extension/context.proto";

option go_package = "proto/extension";


service EnvoyGatewayExtension {
	// PostRouteModify provides a way for extensions to modify a route generated by Envoy Gateway before it is finalized.
	// Doing so allows extensions to configure/modify route fields configured by Envoy Gateway and also to configure the
	// Route's TypedPerFilterConfig which may be desirable to do things such as pass settings and information to
	// ext_authz filters.
	// PostRouteModify also passes a list of Unstructured data for the externalRefs owned by the extension on the HTTPRoute that
	// created this xDS route
	// PostRouteModify will only be executed if an extension is loaded and only on Routes which were generated from an HTTPRoute
	// that uses extension resources as externalRef filters.
    rpc PostRouteModify (PostRouteModifyRequest) returns (PostRouteModifyResponse) {};

	// PostVirtualHostModify provides a way for extensions to modify a VirtualHost generated by Envoy Gateway before it is finalized.
	// An extension can also make use of this hook to generate and insert entirely new Routes not generated by Envoy Gateway.
	// PostVirtualHostModify is always executed when an extension is loaded. An extension may return nil to not make any changes
    // to it.
    rpc PostVirtualHostModify(PostVirtualHostModifyRequest) returns (PostVirtualHostModifyResponse) {};

	// PostHTTPListenerModify allows an extension to make changes to a Listener generated by Envoy Gateway before it is finalized.
	// PostHTTPListenerModify is always executed when an extension is loaded. An extension may return nil
    // in order to not make any changes to it.
    rpc PostHTTPListenerModify(PostHTTPListenerModifyRequest) returns (PostHTTPListenerModifyResponse) {};

	// PostClusterModify provides a way for extensions to modify clusters generated by Envoy Gateway for custom backends.
	// This allows extensions to modify cluster configurations for custom backend types while letting Envoy Gateway
	// control cluster naming and basic configuration. This hook is called when custom backend resources are used
	// in HTTPRoute or GRPCRoute backendRefs.
	rpc PostClusterModify(PostClusterModifyRequest) returns (PostClusterModifyResponse) {};

	// PostEndpointsModify provides a way for extensions to modify a ClusterLoadAssignment generated by Envoy Gateway
	// before it is sent over EDS. This allows extensions to set per-endpoint metadata or apply endpoint overrides.
	rpc PostEndpointsModify(PostEndpointsModifyRequest) returns (PostEndpointsModifyResponse) {};

	// PostTranslateModify allows an extension to modify the translated xDS resources before they are sent to Envoy.
	// Extensions can inspect and update the generated clusters, secrets, listeners, and routes, or inject additional resources
	// that need to be created dynamically.
	// The lists returned by the extension are used as the final lists of clusters, secrets, listeners, and routes.
	// This hook is executed when an extension is loaded and has subscribed to the post-translation hook.
	rpc PostTranslateModify(PostTranslateModifyRequest) returns (PostTranslateModifyResponse) {};

	// PostTLSCertificateResolve asks an extension how Envoy should obtain a listener TLS
	// certificate that was referenced from a kind registered in
	// ExtensionManager.CertificateResources.
	//
	// It is invoked once per such certificate, after Envoy Gateway has confirmed the
	// reference is permitted and that the resource reports Ready. The extension returns the
	// SdsSecretConfig to place on the filter chain. Envoy Gateway emits no Secret of its own
	// for these certificates, so no key material passes through the control plane.
	//
	// Unlike the other hooks, resolution is not chained: the extension that registered the
	// referenced group and kind is the only one consulted.
	rpc PostTLSCertificateResolve(PostTLSCertificateResolveRequest) returns (PostTLSCertificateResolveResponse) {};
}

// PostRouteModifyRequest sends a Route that was generated by Envoy Gateway along with context information to an extension so that the Route can be modified
message PostRouteModifyRequest {
    envoy.config.route.v3.Route route = 1;
    PostRouteExtensionContext post_route_context = 2;
}


// PostRouteModifyResponse is the expected response from an extension and contains a modified version of the Route that was sent
// If an extension returns a nil Route then it will not be modified
message PostRouteModifyResponse {
    envoy.config.route.v3.Route route = 1;
}


// PostClusterModifyRequest sends a single cluster to an extension for custom backend processing
message PostClusterModifyRequest {
    envoy.config.cluster.v3.Cluster cluster = 1;
    PostClusterExtensionContext post_cluster_context = 2;
}

// PostClusterModifyResponse is the expected response from an extension and contains a modified cluster
message PostClusterModifyResponse {
    envoy.config.cluster.v3.Cluster cluster = 1;
}

// PostEndpointsModifyRequest sends a ClusterLoadAssignment to an extension for endpoint modification
message PostEndpointsModifyRequest {
    envoy.config.endpoint.v3.ClusterLoadAssignment load_assignment = 1;
    PostEndpointsExtensionContext post_endpoints_context = 2;
}

// PostEndpointsModifyResponse is the expected response from an extension and contains a modified ClusterLoadAssignment
message PostEndpointsModifyResponse {
    envoy.config.endpoint.v3.ClusterLoadAssignment load_assignment = 1;
}


// PostVirtualHostModifyRequest sends a VirtualHost that was generated by Envoy Gateway along with context information to an extension so that the VirtualHost can be modified
message PostVirtualHostModifyRequest {
    envoy.config.route.v3.VirtualHost virtual_host = 1;
    PostVirtualHostExtensionContext post_virtual_host_context = 2;
}

// PostVirtualHostModifyResponse is the expected response from an extension and contains a modified version of the VirtualHost that was sent
// If an extension returns a nil Virtual Host then it will not be modified
message PostVirtualHostModifyResponse {
    envoy.config.route.v3.VirtualHost virtual_host = 1;
}

// PostVirtualHostModifyRequest sends a Listener that was generated by Envoy Gateway along with context information to an extension so that the Listener can be modified
message PostHTTPListenerModifyRequest {
    envoy.config.listener.v3.Listener listener = 1;
    PostHTTPListenerExtensionContext post_listener_context = 2;
}


// PostHTTPListenerModifyResponse is the expected response from an extension and contains a modified version of the Listener that was sent
// If an extension returns a nil Listener then it will not be modified
message PostHTTPListenerModifyResponse {
    envoy.config.listener.v3.Listener listener = 1;
}


// PostTranslateModifyRequest sends clusters, secrets, listeners, and routes to an extension.
// The extension is free to add/modify/remove the resources it received.
message PostTranslateModifyRequest {
    PostTranslateExtensionContext post_translate_context = 1;
    repeated envoy.config.cluster.v3.Cluster clusters = 2;
    repeated envoy.extensions.transport_sockets.tls.v3.Secret secrets = 3;
    repeated envoy.config.listener.v3.Listener listeners = 4;
    repeated envoy.config.route.v3.RouteConfiguration routes = 5;
}


// PostTranslateModifyResponse is the expected response from an extension and contains
// the full list of xDS clusters, secrets, listeners, and routes to be used for the xDS config.
message PostTranslateModifyResponse {
    repeated envoy.config.cluster.v3.Cluster clusters = 1;
    repeated envoy.extensions.transport_sockets.tls.v3.Secret secrets = 2;
    repeated envoy.config.listener.v3.Listener listeners = 3;
    repeated envoy.config.route.v3.RouteConfiguration routes = 4;
}


// PostTLSCertificateResolveRequest asks an extension how Envoy should obtain one listener
// TLS certificate referenced from an extension-registered kind.
message PostTLSCertificateResolveRequest {
    PostTLSCertificateExtensionContext post_tls_certificate_context = 1;
}


// PostTLSCertificateResolveResponse tells Envoy Gateway how to reference the certificate.
message PostTLSCertificateResolveResponse {
    // How Envoy obtains the certificate. The name is the identifier the data plane knows the
    // certificate by.
    //
    // sds_config is optional and decides how Envoy treats the name. Envoy's own semantics:
    // "When both name and config are specified, then secret can be fetched and/or reloaded
    // via SDS. When only name is specified, then secret will be loaded from static
    // resources."
    //
    // So leaving it unset suits a data plane that resolves the name from its own store, and
    // setting it suits a provider serving the certificate over SDS, which also gets Envoy's
    // gentler handling of a secret that has not arrived yet: the listener warms rather than
    // the update being rejected. Envoy Gateway substitutes no default either way.
    envoy.extensions.transport_sockets.tls.v3.SdsSecretConfig sds_secret_config = 1;

    // Clusters the SdsSecretConfig depends on, for a provider reached over the network
    // rather than resolved locally by the data plane. Additive only: a name that collides
    // with an existing cluster is an error rather than a replacement.
    //
    // NOT YET IMPLEMENTED. Adding a cluster means writing to the resource table, which the
    // listener build path cannot currently reach, so a non-empty value is rejected rather
    // than silently dropped. Until then an sds_config may only name a cluster Envoy Gateway
    // already emits, or use a config source needing none: ADS, a filesystem path, or self.
    repeated envoy.config.cluster.v3.Cluster clusters = 2;

    // Secrets the extension wants Envoy Gateway to serve directly. Populating this places
    // key material in the xDS stream, so a provider that can avoid it should.
    //
    // NOT YET IMPLEMENTED, and rejected for the same reason as clusters.
    repeated envoy.extensions.transport_sockets.tls.v3.Secret secrets = 3;

    // DNS names on the certificate. Envoy Gateway cannot inspect a certificate it never
    // sees, so without these it must treat the certificate as opaque and disable HTTP/2 on
    // any port the listener shares with another HTTPS listener. Supplying them restores
    // normal overlap detection.
    repeated string dns_names = 4;

    // Reason and message describing a resolution failure. When reason is set the certificate
    // is treated as unresolved. Readiness is reported on the resource itself rather than
    // here, so this covers translation-time failure only.
    string failure_reason = 5;
    string failure_message = 6;
}
